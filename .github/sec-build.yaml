    Fingerprint: sha256:af1cc144093c738caeda8d8e3821f0d470edafb3924205b0c46c45c59b9c5819
    Title: 'urllib3: urllib3: Denial of Service via unbounded memory allocation in chunk parser'
    Description: 'urllib3 is an HTTP client library for Python. From 1.10.3 until 2.8.0, the HTTPResponse.read_chunked and HTTPResponse.stream methods can allocate unbounded memory because the streaming chunk parser buffers the chunk-size field until newline or EOF without a length bound. The trigger is that a malicious server returns Transfer-Encoding: chunked followed by a very long run of bytes without a newline. The attack mechanism is that a malicious HTTP server sends a very long unterminated chunk-size line. The impact is that unbounded memory allocation can exhaust the client process. This issue is fixed in version 2.8.0.'
